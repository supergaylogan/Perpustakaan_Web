<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Mahasiswa - Perpustakaan Kampus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('beranda') }}">
                <i class="fa-solid fa-book-open-reader me-2"></i>
                Perpustakaan Kampus
            </a>
            <div class="d-flex gap-2">
                <a href="{{ url_for('beranda') }}" class="btn btn-outline-light btn-sm">
                    <i class="fa-solid fa-book me-1"></i> Katalog Buku
                </a>
                <a href="{{ url_for('daftar_mahasiswa') }}" class="btn btn-outline-light btn-sm">
                    <i class="fa-solid fa-users me-1"></i> Data Mahasiswa
                </a>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-white py-3">
                        <h5 class="m-0 fw-bold text-primary">
                            <i class="fa-solid fa-user-plus me-2"></i>
                            Tambah Data Mahasiswa
                        </h5>
                    </div>

                    <div class="card-body p-4">
                        {% if pesan %}
                        <div class="alert alert-{{ kategori }} alert-dismissible fade show" role="alert">
                            {{ pesan }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        {% endif %}

                        <form method="POST" action="{{ url_for('tambah_mahasiswa') }}">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">NIM</label>
                                <input type="text" name="nim" class="form-control" placeholder="Contoh: 2310101031">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nama Lengkap</label>
                                <input type="text" name="nama" class="form-control" placeholder="Masukkan nama lengkap">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" name="email" class="form-control" placeholder="nama@student.ac.id">
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success flex-grow-1">
                                    <i class="fa-solid fa-floppy-disk me-1"></i> Simpan Data
                                </button>
                                <a href="{{ url_for('daftar_mahasiswa') }}" class="btn btn-secondary">
                                    Kembali
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
