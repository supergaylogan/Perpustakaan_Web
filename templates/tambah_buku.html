<!DOCTYPE html>

<html lang="id">

<head>

```
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tambah Buku - Perpustakaan Kampus</title>

<!-- Bootstrap 5 CSS -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- FontAwesome -->
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
```

</head>

<body class="bg-light">

```
<!-- ==========================================
     NAVBAR
=========================================== -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{{ url_for('beranda') }}">

            <i class="fa-solid fa-book-open-reader me-2"></i>

            Perpustakaan Kampus

        </a>

    </div>

</nav>


<!-- ==========================================
     FORM TAMBAH BUKU
=========================================== -->

<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">


            <div class="card shadow-sm border-0 rounded-3">


                <!-- HEADER -->

                <div class="card-header bg-white py-3">

                    <h5 class="m-0 fw-bold text-primary">

                        <i class="fa-solid fa-plus me-2"></i>

                        Tambah Buku

                    </h5>

                    <small class="text-muted">

                        Masukkan informasi buku yang ingin ditambahkan.

                    </small>

                </div>


                <!-- BODY -->

                <div class="card-body p-4">


                    <form
                        action="{{ url_for('tambah_buku') }}"
                        method="POST">


                        <!-- ==========================================
                             JUDUL BUKU
                        =========================================== -->

                        <div class="mb-3">

                            <label
                                for="judul"
                                class="form-label fw-semibold">

                                <i class="fa-solid fa-book me-1 text-primary"></i>

                                Judul Buku

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="judul"
                                name="judul"
                                placeholder="Masukkan judul buku"
                                required>

                        </div>


                        <!-- ==========================================
                             PENULIS
                        =========================================== -->

                        <div class="mb-3">

                            <label
                                for="penulis"
                                class="form-label fw-semibold">

                                <i class="fa-solid fa-user-pen me-1 text-primary"></i>

                                Penulis

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="penulis"
                                name="penulis"
                                placeholder="Masukkan nama penulis"
                                required>

                        </div>


                        <!-- ==========================================
                             STOK
                        =========================================== -->

                        <div class="mb-4">

                            <label
                                for="stok"
                                class="form-label fw-semibold">

                                <i class="fa-solid fa-boxes-stacked me-1 text-primary"></i>

                                Jumlah Stok

                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="stok"
                                name="stok"
                                min="1"
                                placeholder="Masukkan jumlah stok"
                                required>

                            <div class="form-text">

                                Masukkan jumlah buku yang tersedia di perpustakaan.

                            </div>

                        </div>


                        <!-- ==========================================
                             TOMBOL
                        =========================================== -->

                        <div class="d-flex justify-content-end gap-2">


                            <!-- BATAL -->

                            <a
                                href="{{ url_for('beranda') }}"
                                class="btn btn-secondary">

                                <i class="fa-solid fa-arrow-left me-1"></i>

                                Batal

                            </a>


                            <!-- SIMPAN -->

                            <button
                                type="submit"
                                class="btn btn-primary">

                                <i class="fa-solid fa-plus me-1"></i>

                                Tambah Buku

                            </button>


                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
```

</body>

</html>
